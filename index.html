<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UguzScripts - Roblox Script Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            max-width: 800px;
            margin: 10px auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .site-title {
            font-size: 28px;
            font-weight: 800;
            color: #58a6ff;
            text-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .script-card {
            background: #161b22;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        /* --- ÖZEL TOP EFEKTLERİ --- */
        .script-card.top1-card {
            border: 1px solid #d29922;
            box-shadow: 0 0 15px rgba(210, 153, 34, 0.25);
        }
        .script-card.top1-card:hover {
            border-color: #f1e05a;
            box-shadow: 0 0 25px rgba(241, 224, 90, 0.45);
            transform: translateY(-2px);
        }

        .script-card.top2-card {
            border: 1px solid #8b949e;
            box-shadow: 0 0 15px rgba(139, 148, 158, 0.2);
        }
        .script-card.top2-card:hover {
            border-color: #58a6ff;
            box-shadow: 0 0 25px rgba(88, 166, 255, 0.4);
            transform: translateY(-2px);
        }

        .script-card.top3-card {
            border: 1px solid #da3633;
            box-shadow: 0 0 15px rgba(218, 54, 51, 0.2);
        }
        .script-card.top3-card:hover {
            border-color: #f85149;
            box-shadow: 0 0 25px rgba(248, 81, 73, 0.4);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .script-name {
            font-size: 18px;
            font-weight: bold;
            color: #f0f6fc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-nokey {
            background: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        .badge-top1 {
            background: rgba(241, 224, 90, 0.2);
            color: #f1e05a;
            border: 1px solid #f1e05a;
            font-size: 12px;
        }

        .badge-top2 {
            background: rgba(139, 148, 158, 0.2);
            color: #c9d1d9;
            border: 1px solid #8b949e;
            font-size: 12px;
        }

        .badge-top3 {
            background: rgba(218, 54, 51, 0.2);
            color: #f85149;
            border: 1px solid #da3633;
            font-size: 12px;
        }

        /* --- GÖRSEL STİLİ --- */
        .script-preview-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 12px;
            display: block;
        }

        .code-box {
            background-color: #0d1117;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 50px;
            background: transparent;
            border: none;
            color: #7ee787;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }

        .btn-copy {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-copy:hover {
            background-color: #30363d;
            color: #ffffff;
            border-color: #8b949e;
        }

        .btn-copy.copied {
            background-color: #238636 !important;
            color: #ffffff !important;
            border-color: #2ea043 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="site-title">
            <i class="fa-solid fa-code"></i> UguzScripts
        </div>
    </header>

    <div class="container">

        <!-- TOP 1: PulseHub -->
        <div class="script-card top1-card">
            <div class="card-header">
                <div class="script-name">PulseHub</div>
                <div class="badge-group">
                    <span class="badge badge-top1"><i class="fa-solid fa-crown"></i> Top 1</span>
                    <span class="badge badge-nokey">No Key</span>
                </div>
            </div>
            
            <img src="pulse.png" alt="PulseHub Önizleme" class="script-preview-img">

            <div class="code-box">
                <textarea readonly>https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/PulseHub.lua</textarea>
            </div>
            <button class="btn-copy" onclick="kopyala(this)">
                <i class="fa-regular fa-copy"></i> Copy
            </button>
        </div>

        <!-- TOP 2: KdmlScript -->
        <div class="script-card top2-card">
            <div class="card-header">
                <div class="script-name">KdmlScript</div>
                <div class="badge-group">
                    <span class="badge badge-top2"><i class="fa-solid fa-medal"></i> Top 2</span>
                    <span class="badge badge-nokey">No Key</span>
                </div>
            </div>

            <img src="kdml.png" alt="KdmlScript Önizleme" class="script-preview-img">

            <div class="code-box">
                <textarea readonly>https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Kdml.lua</textarea>
            </div>
            <button class="btn-copy" onclick="kopyala(this)">
                <i class="fa-regular fa-copy"></i> Copy
            </button>
        </div>

        <!-- TOP 3: Weapon Spawner -->
        <div class="script-card top3-card">
            <div class="card-header">
                <div class="script-name">Weapon Spawner</div>
                <div class="badge-group">
                    <span class="badge badge-top3"><i class="fa-solid fa-award"></i> Top 3</span>
                    <span class="badge badge-nokey">No Key</span>
                </div>
            </div>

            <img src="spawner.jpg" alt="Weapon Spawner Önizleme" class="script-preview-img">

            <div class="code-box">
                <textarea readonly>https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/WeaponSpawner.lua</textarea>
            </div>
            <button class="btn-copy" onclick="kopyala(this)">
                <i class="fa-regular fa-copy"></i> Copy
            </button>
        </div>

    </div>

    <script>
        function kopyala(btn) {
            let textarea = btn.previousElementSibling.querySelector('textarea');
            textarea.select();
            navigator.clipboard.writeText(textarea.value);

            btn.classList.add('copied');
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';

            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
            }, 2000);
        }
    </script>

</body>
</html>
