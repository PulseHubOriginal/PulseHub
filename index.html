<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UguzScripts - Roblox Script Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #c9d1d9;
            padding: 40px 20px;
            min-height: 100vh;
        }

        header {
            max-width: 900px;
            margin: 0 auto 35px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 15px;
            border-bottom: 1px solid #1f242d;
        }

        .site-title {
            font-size: 26px;
            font-weight: 800;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- KART YAPISI --- */
        .script-card {
            background: #131720;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 1px solid #212631;
            transition: all 0.25s ease;
        }

        .script-card.top1-card { border-color: rgba(241, 224, 90, 0.4); }
        .script-card.top1-card:hover { border-color: #f1e05a; box-shadow: 0 6px 24px rgba(241, 224, 90, 0.15); }

        .script-card.top2-card { border-color: rgba(139, 148, 158, 0.4); }
        .script-card.top2-card:hover { border-color: #58a6ff; box-shadow: 0 6px 24px rgba(88, 166, 255, 0.15); }

        .script-card.top3-card { border-color: rgba(248, 81, 73, 0.4); }
        .script-card.top3-card:hover { border-color: #f85149; box-shadow: 0 6px 24px rgba(248, 81, 73, 0.15); }

        /* GÖRSEL ALANI */
        .img-container {
            width: 180px;
            height: 115px;
            flex-shrink: 0;
            background-color: #080a0f;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #21262d;
            cursor: pointer;
        }

        .script-preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .script-card:hover .script-preview-img {
            transform: scale(1.05);
        }

        /* İÇERİK */
        .card-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .script-name {
            font-size: 19px;
            font-weight: 700;
            color: #f0f6fc;
        }

        .badge-group {
            display: flex;
            gap: 6px;
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-nokey { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
        .badge-top1 { background: rgba(241, 224, 90, 0.15); color: #f1e05a; border: 1px solid rgba(241, 224, 90, 0.4); }
        .badge-top2 { background: rgba(139, 148, 158, 0.15); color: #c9d1d9; border: 1px solid rgba(139, 148, 158, 0.4); }
        .badge-top3 { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.4); }

        /* BUTONLAR */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #1f242d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { background-color: #30363d; color: #fff; }

        .btn-primary {
            background-color: #238636;
            color: #fff;
            border-color: #2ea043;
        }
        .btn-primary:hover { background-color: #2ea043; }

        .btn-primary.copied {
            background-color: #38bdf8 !important;
            border-color: #0284c7 !important;
        }

        /* --- POPUP (MODAL) STİLLERİ --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #58a6ff;
        }

        .modal-close {
            background: none;
            border: none;
            color: #8b949e;
            font-size: 20px;
            cursor: pointer;
        }
        .modal-close:hover { color: #f0f6fc; }

        .feature-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #21262d;
            font-size: 14px;
        }

        .feature-item i { color: #3fb950; }

        .loadstring-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #7ee787;
            word-break: break-all;
        }

        @media (max-width: 650px) {
            .script-card { flex-direction: column; align-items: stretch; }
            .img-container { width: 100%; height: 160px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="site-title">
            <i class="fa-solid fa-code"></i> UguzScripts
        </div>
    </header>

    <div class="container">

        <!-- PulseHub -->
        <div class="script-card top1-card">
            <div class="img-container" onclick="openModal('pulse')">
                <img src="pulse.png" alt="PulseHub" class="script-preview-img">
            </div>
            <div class="card-details">
                <div class="card-header">
                    <div class="script-name">PulseHub</div>
                    <div class="badge-group">
                        <span class="badge badge-top1"><i class="fa-solid fa-crown"></i> Top 1</span>
                        <span class="badge badge-nokey">No Key</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="copyLoadstring('loadstring(game:HttpGet(\'https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/PulseHub.lua\'))()', this)">
                        <i class="fa-regular fa-copy"></i> Get Script (Loadstring)
                    </button>
                    <button class="btn" onclick="openModal('pulse')">
                        <i class="fa-solid fa-list-check"></i> Features
                    </button>
                </div>
            </div>
        </div>

        <!-- KdmlScript -->
        <div class="script-card top2-card">
            <div class="img-container" onclick="openModal('kdml')">
                <img src="kdml.png" alt="KdmlScript" class="script-preview-img">
            </div>
            <div class="card-details">
                <div class="card-header">
                    <div class="script-name">KdmlScript</div>
                    <div class="badge-group">
                        <span class="badge badge-top2"><i class="fa-solid fa-medal"></i> Top 2</span>
                        <span class="badge badge-nokey">No Key</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="copyLoadstring('loadstring(game:HttpGet(\'https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Kdml.lua\'))()', this)">
                        <i class="fa-regular fa-copy"></i> Get Script (Loadstring)
                    </button>
                    <button class="btn" onclick="openModal('kdml')">
                        <i class="fa-solid fa-list-check"></i> Features
                    </button>
                </div>
            </div>
        </div>

        <!-- Weapon Spawner -->
        <div class="script-card top3-card">
            <div class="img-container" onclick="openModal('spawner')">
                <img src="spawner.jpg" alt="Weapon Spawner" class="script-preview-img">
            </div>
            <div class="card-details">
                <div class="card-header">
                    <div class="script-name">Weapon Spawner</div>
                    <div class="badge-group">
                        <span class="badge badge-top3"><i class="fa-solid fa-award"></i> Top 3</span>
                        <span class="badge badge-nokey">No Key</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="copyLoadstring('loadstring(game:HttpGet(\'https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/WeaponSpawner.lua\'))()', this)">
                        <i class="fa-regular fa-copy"></i> Get Script (Loadstring)
                    </button>
                    <button class="btn" onclick="openModal('spawner')">
                        <i class="fa-solid fa-list-check"></i> Features
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- POP-UP / MODAL OVERLAY -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Script Details</div>
                <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <ul class="feature-list" id="modalFeatures"></ul>

            <div style="font-size: 12px; margin-bottom: 6px; color: #8b949e;">Loadstring Code:</div>
            <div class="loadstring-box" id="modalCode"></div>
        </div>
    </div>

    <script>
        const scriptData = {
            pulse: {
                title: "PulseHub Features",
                features: [
                    "Auto Farm & Teleport System",
                    "Full ESP (Role ESP, Gun ESP, Box ESP)",
                    "Player Trolls & Free Animations",
                    "Infinite Jump & Anti-Fling",
                    "No Key System & Fast Load"
                ],
                code: "loadstring(game:HttpGet('https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/PulseHub.lua'))()"
            },
            kdml: {
                title: "KdmlScript Features",
                features: [
                    "Visual Gold Bomb (MM2 Special)",
                    "Show FPS & Speed Boost",
                    "Auto Farm & Silent Aim",
                    "Teleport to Murderer / Sheriff",
                    "Full Visual Customization"
                ],
                code: "loadstring(game:HttpGet('https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Kdml.lua'))()"
            },
            spawner: {
                title: "MM2 Weapon Spawner Features",
                features: [
                    "Spawn All Knives & Guns",
                    "Equippable & Tradable Visual Items",
                    "Godly, Ancient & Unique Weapon Support",
                    "Search Weapons Panel",
                    "Instant Inventory Refresh"
                ],
                code: "loadstring(game:HttpGet('https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/WeaponSpawner.lua'))()"
            }
        };

        function copyLoadstring(text, btn) {
            navigator.clipboard.writeText(text);
            btn.classList.add('copied');
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<i class="fa-regular fa-copy"></i> Get Script (Loadstring)';
            }, 2000);
        }

        function openModal(key) {
            const data = scriptData[key];
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalCode').innerText = data.code;

            const list = document.getElementById('modalFeatures');
            list.innerHTML = data.features.map(f => `<li class="feature-item"><i class="fa-solid fa-circle-check"></i> ${f}</li>`).join('');

            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if(e.target === document.getElementById('modalOverlay')) closeModal();
        });
    </script>

</body>
</html>
