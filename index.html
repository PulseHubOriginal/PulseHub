<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UguzScripts - Roblox Scripts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0e1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --accent-blue: #58a6ff;
            --accent-green: #2ea043;
            --accent-gold: #f1e05a;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        /* Üst Filtre Butonları (Rscripts Tarzı) */
        .filter-bar {
            max-width: 1200px;
            margin: 0 auto 25px auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #21262d;
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--text-main);
            color: #000;
            border-color: var(--text-main);
        }

        /* Script Grid Kataloğu */
        .script-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
        }

        .card-img-wrap {
            width: 100%;
            height: 140px;
            background: #0d1117;
            position: relative;
            overflow: hidden;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-top-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }

        .card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            width: fit-content;
        }

        .badge-nokey {
            background: rgba(46, 160, 67, 0.2);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.4);
        }

        .badge-key {
            background: rgba(210, 153, 34, 0.2);
            color: var(--accent-gold);
            border: 1px solid rgba(210, 153, 34, 0.4);
        }

        .badge-top {
            background: rgba(88, 166, 255, 0.2);
            color: var(--accent-blue);
            border: 1px solid rgba(88, 166, 255, 0.4);
            margin-right: 5px;
        }

        /* MODAL / TIKLAYINCA AÇILAN DETAY PENCERESİ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: #161b22;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 22px;
            color: var(--text-sub);
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 650px) {
            .modal-grid { grid-template-columns: 1fr; }
        }

        .modal-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .modal-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .code-box {
            background: #0d1117;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
        }

        textarea {
            width: 100%;
            height: 45px;
            background: transparent;
            border: none;
            color: #7ee787;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            outline: none;
        }

        .btn-copy {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .btn-copy:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }

        .btn-copy.copied {
            background: var(--accent-green) !important;
            color: #fff !important;
        }

        .features-box {
            background: #0d1117;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 15px;
        }

        .features-box h3 {
            font-size: 16px;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .features-box ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
        }

        .features-box li {
            font-size: 13px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .features-box li i { color: #3fb950; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo"><i class="fa-solid fa-code"></i> UguzScripts</a>
    </header>

    <!-- Filtre Barı -->
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterScripts('all')">All</button>
        <button class="filter-btn" onclick="filterScripts('nokey')">Keyless</button>
        <button class="filter-btn" onclick="filterScripts('key')">Key System</button>
    </div>

    <!-- Script Listesi (Grid) -->
    <div class="script-grid" id="scriptGrid"></div>

    <!-- Tıklanınca Açılan Detay Penceresi (Modal) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <span class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></span>
            
            <div class="modal-grid">
                <img id="mImg" class="modal-img" src="" alt="Script Image">
                <div class="modal-info">
                    <div>
                        <h2 id="mTitle" style="font-size:20px; margin-bottom: 8px;"></h2>
                        <span id="mBadge" class="badge"></span>
                        <div class="code-box">
                            <textarea id="mCode" readonly></textarea>
                        </div>
                    </div>
                    <button class="btn-copy" id="mCopyBtn" onclick="copyModalCode()">
                        <i class="fa-regular fa-copy"></i> Copy Script
                    </button>
                </div>
            </div>

            <div class="features-box">
                <h3><i class="fa-solid fa-list-check"></i> Features</h3>
                <ul id="mFeatures"></ul>
            </div>
        </div>
    </div>

    <script>
        // TÜM SCRIPTLERİN VERİ TABANI
        const scripts = [
            {
                id: 1,
                title: "Bloxluck Predictor download link retrieval script.",
                topTag: "Top 1 👑",
                type: "nokey",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/bloxluckop.lua"))()',
                features: ["Auto Predictor", "Fast Retrieval", "Anti AFK", "Undetected 2026", "No Key System", "Easy UI"]
            },
            {
                id: 2,
                title: "PulseHub MM2",
                topTag: "Top 2",
                type: "nokey",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Mm2.lua"))()',
                features: ["Auto Farm Coins", "Player ESP", "Silent Aim", "Kill All", "Gun Drop Grabber", "Speed Slider"]
            },
            {
                id: 3,
                title: "KdmlScript",
                topTag: "Top 3",
                type: "nokey",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Kdml.lua"))()',
                features: ["Auto Farm", "Teleports", "ESP", "Walkspeed", "JumpPower", "Keyless"]
            },
            {
                id: 4,
                title: "Riftware",
                topTag: "Top 4",
                type: "nokey",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Riftware.lua"))()',
                features: ["Aimbot", "ESP Line/Box", "Speed Hack", "Noclip", "Server Hop"]
            },
            {
                id: 5,
                title: "Yarhm",
                topTag: "Top 5",
                type: "nokey",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Yarhm.lua"))()',
                features: ["Universal ESP", "Btools", "Fly", "Infinite Jump", "Anti AFK"]
            },
            {
                id: 6,
                title: "KuniHub",
                type: "nokey",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Kunihub.lua"))()',
                features: ["Auto Farm", "Combat Features", "Teleports", "Player Stats"]
            },
            {
                id: 7,
                title: "Moondiety",
                type: "key",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Moondiety.lua"))()',
                features: ["Key System Required", "OP Auto Farm", "Full ESP", "God Mode"]
            },
            {
                id: 8,
                title: "Foxname",
                type: "nokey",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Foxname.lua"))()',
                features: ["No Key", "Auto Quest", "Fast Mob Farm", "Stat Reset"]
            },
            {
                id: 9,
                title: "ForgeHub",
                type: "key",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/ForgeHub.lua"))()',
                features: ["Key System Required", "Auto Forge", "Item Dupe Detector", "Teleport Menu"]
            },
            {
                id: 10,
                title: "Sorlua",
                type: "key",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/Sorlua.lua"))()',
                features: ["Key System Required", "Combat Mods", "ESP Options", "Config Saver"]
            },
            {
                id: 11,
                title: "Unlock All Weapons",
                type: "nokey",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/UnlockAll.lua"))()',
                features: ["Skin Changer", "Unlock Weapons", "Visual Only", "Keyless"]
            },
            {
                id: 12,
                title: "Weapon Spawner",
                type: "nokey",
                img: "https://xenoscripts.com/wp-content/uploads/2024/01/pulse-hub-mm2.png",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/PulseHubOriginal/PulseHub/refs/heads/main/WeaponSpawner.lua"))()',
                features: ["Local Weapon Spawner", "Client Side", "Easy Toggle", "Keyless"]
            }
        ];

        // Kartları Ekrana Yazdırma
        function renderScripts(filter = 'all') {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = '';

            scripts.forEach(s => {
                if(filter !== 'all' && s.type !== filter) return;

                let topBadgeHtml = s.topTag ? `<span class="badge badge-top">${s.topTag}</span>` : '';
                let keyBadgeHtml = s.type === 'nokey' ? '<span class="badge badge-nokey">No Key</span>' : '<span class="badge badge-key">Key System</span>';

                let card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(s);

                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${s.img}" alt="${s.title}">
                        ${s.topTag ? `<div class="card-top-tag">${s.topTag}</div>` : ''}
                    </div>
                    <div class="card-body">
                        <div class="card-title">${s.title}</div>
                        <div>
                            ${topBadgeHtml}
                            ${keyBadgeHtml}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Modal Açma Fonksiyonu
        function openModal(s) {
            document.getElementById('mImg').src = s.img;
            document.getElementById('mTitle').innerText = s.title;
            document.getElementById('mCode').value = s.code;

            let badge = document.getElementById('mBadge');
            if(s.type === 'nokey') {
                badge.className = 'badge badge-nokey';
                badge.innerText = 'No Key';
            } else {
                badge.className = 'badge badge-key';
                badge.innerText = 'Key System';
            }

            let featList = document.getElementById('mFeatures');
            featList.innerHTML = '';
            s.features.forEach(f => {
                featList.innerHTML += `<li><i class="fa-solid fa-check"></i> ${f}</li>`;
            });

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        // Kopyalama Butonu
        function copyModalCode() {
            let area = document.getElementById('mCode');
            area.select();
            navigator.clipboard.writeText(area.value);

            let btn = document.getElementById('mCopyBtn');
            btn.classList.add('copied');
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';

            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy Script';
            }, 2000);
        }

        // Filtre Butonları
        function filterScripts(type) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderScripts(type);
        }

        // Dışarı tıklayınca kapansın
        window.onclick = function(event) {
            let modal = document.getElementById('modalOverlay');
            if (event.target == modal) closeModal();
        }

        // İlk yükleme
        renderScripts();
    </script>
</body>
</html>
